<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="EasyBuy is an e-commerce platform to shop curated fashion easily with fast checkout, secure payments, and a seamless experience."
    />

    <!-- Favicons (leading slash so nested routes don't 404) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Preconnect to API & Image CDN -->
    <link rel="preconnect" href="https://ecommerce-store-h30g.onrender.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Preload LCP Hero Banner -->
    <link
      rel="preload"
      as="image"
      href="/banner/menShirts-1280.avif"
      imagesrcset="/banner/menShirts-640.avif 640w, /banner/menShirts-1280.avif 1280w"
      imagesizes="(max-width: 768px) 100vw, 1280px"
      fetchpriority="high"
    />

    <title>EasyBuy — Curated Fashion &amp; Everyday Essentials</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
